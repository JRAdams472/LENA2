name: Test

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

env:
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy
  NEXT_PUBLIC_API_BASE_URL: /graphql

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -v -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        working-directory: clients/web
        run: npm ci

      - name: TypeScript check
        working-directory: clients/web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: clients/web
        run: npm run lint

      - name: Unit tests
        working-directory: clients/web
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: clients/web
        run: npm run build
