name: Test

on:
  push:
    branches:
      - main
      - "phase-*"
      - "mobile-redesign-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: e2e-client
  NEXT_PUBLIC_API_BASE_URL: /graphql
  # Baseline total statement coverage measured on production code and
  # generated sqlc code; gomock packages are filtered out of the profile by
  # tools/coveragefilter. Raise as coverage improves.
  GO_COVERAGE_MIN: "60"

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Scope to the Go source trees so stray Go files under
      # clients/web/node_modules can't break local or CI runs.
      - name: Go build
        run: go build ./cmd/... ./internal/...

      - name: Go vet
        run: go vet ./cmd/... ./internal/...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/... ./internal/...

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Go test with coverage
        # Use -coverpkg over the same package tree so tests that call
        # generated sqlc code also attribute statements to the sqlc packages
        # without pulling in the whole module (e.g. clients/web).
        run: |
          coverpkg=$(go list -f '{{.ImportPath}}' ./cmd/... ./internal/... | tr '\n' ',' | sed 's/,$//')
          go test -race -count=1 -timeout 20m -coverprofile=coverage.out -covermode=atomic -coverpkg="$coverpkg" ./cmd/... ./internal/...

      - name: Filter generated code from coverage
        run: go run ./tools/coveragefilter < coverage.out > coverage-filtered.out

      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage-filtered.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total statement coverage: ${total}% (minimum ${GO_COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$GO_COVERAGE_MIN" 'BEGIN { exit !(t+0 >= m+0) }'

      - name: Upload Go coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-filtered.out
          retention-days: 2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: ./cmd/... ./internal/...

  ocr-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Recipe import unit tests
        run: go test ./internal/app/recipeimport/... ./internal/ocrimport/... ./internal/platform/ollamaclient/... ./internal/platform/profanity/...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        working-directory: clients/web
        run: npm ci

      - name: TypeScript check
        working-directory: clients/web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: clients/web
        run: npm run lint

      - name: Unit tests with coverage
        working-directory: clients/web
        run: npm run test:coverage

      - name: Build
        working-directory: clients/web
        run: npm run build

      - name: Upload Jest coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jest-coverage
          path: clients/web/coverage
          retention-days: 2

  e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: e2e-change-me
      LENA_DB_PASSWORD: e2e-change-me
      LENA_GOOGLE_CLIENT_ID: e2e-client
      LENA_AUTH_AUDIENCES: e2e-client,lena-e2e-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start the application stack
        # --profile seed enables the one-shot db-seed job the e2e suite needs.
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile seed up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost/health > /dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "API failed to become healthy" >&2
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail 100
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: clients/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: clients/web
        env:
          E2E_BASE_URL: http://localhost
          E2E_ISSUER_URL: http://localhost:8085
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            clients/web/playwright-report
            clients/web/test-results/junit.xml
          retention-days: 2

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          path: clients/web/test-results
          retention-days: 2

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        working-directory: clients/mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: clients/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: clients/mobile
        run: flutter test

  docker:
    name: docker ${{ matrix.image }}
    needs: [go, lint, web, e2e, mobile]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lena2-api
            context: .
            dockerfile: ./Dockerfile
          - image: lena2-web
            context: clients/web
            dockerfile: clients/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/graphql
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || 'e2e-client' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
