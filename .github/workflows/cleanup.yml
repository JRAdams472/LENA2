name: Cleanup

# Deletes every workflow artifact older than 2 days so artifact storage
# stays small. Runs nightly; also runnable manually via workflow_dispatch.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge-old-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 2 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting artifacts created before ${cutoff}"

          # Collect all artifact ids first (deleting while paginating shifts pages).
          ids=$(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.created_at < \"${cutoff}\") | .id")

          if [ -z "$ids" ]; then
            echo "Nothing to delete"
            exit 0
          fi

          count=0
          for id in $ids; do
            echo "Deleting artifact ${id}"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"
            count=$((count + 1))
          done
          echo "Deleted ${count} artifact(s)"
