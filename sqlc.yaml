version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/identity/queries.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/identity/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
