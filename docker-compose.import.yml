# Optional compose overlay for the recipe OCR import pipeline.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.import.yml --profile import up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: lena2-ollama
    profiles: ["import"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    container_name: lena2-ollama-pull
    profiles: ["import"]
    entrypoint: ["/bin/sh", "-c"]
    command: ollama pull ${LENA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ocr:
    build:
      context: ./tools/ocr
    container_name: lena2-ocr
    profiles: ["import"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
