# Optional compose overlay for the recipe OCR import pipeline.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.import.yml --profile import up -d
services:
  ollama:
    image: ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
    profiles: ["import"]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:${LENA_OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b
    profiles: ["import"]
    entrypoint: ["/bin/sh", "-c"]
    command: ollama pull ${LENA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ocr:
    build:
      context: ./tools/ocr
    profiles: ["import"]
    ports:
      - "127.0.0.1:${LENA_OCR_HOST_PORT:-8000}:8000"
    # The sidecar parses untrusted uploads: read-only root fs, scratch tmpfs
    # for pdf2image/tesseract temp files, and process/memory limits.
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
