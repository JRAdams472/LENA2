services:
  db:
    image: postgres:16.4-alpine
    container_name: lena2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lena}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: migrate/migrate:v4.18.2
    container_name: lena2-db-migrate
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-lena}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-lena}?sslmode=${POSTGRES_SSLMODE:-disable}"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db-seed:
    image: postgres:16.4-alpine
    container_name: lena2-db-seed
    environment:
      PGUSER: ${POSTGRES_USER:-lena}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lena}
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - /bin/sh
      - -c
      - "for f in /seed/*.sql; do [ -e \"$$f\" ] || continue; psql -v ON_ERROR_STOP=1 -f \"$$f\"; done"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lena2-api
    environment:
      LENA_PORT: 8080
      LENA_LOG_LEVEL: ${LENA_LOG_LEVEL:-info}
      LENA_DATABASE_URL: postgres://${POSTGRES_USER:-lena}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-lena}?sslmode=${POSTGRES_SSLMODE:-disable}
      LENA_GOOGLE_CLIENT_ID: ${LENA_GOOGLE_CLIENT_ID:-dummy}
      LENA_AUTH_ISSUERS: ${LENA_AUTH_ISSUERS:-https://accounts.google.com}
      LENA_AUTH_AUDIENCES: ${LENA_AUTH_AUDIENCES:-dummy}
      LENA_CORS_ALLOWED_ORIGINS: ${LENA_CORS_ALLOWED_ORIGINS:-http://localhost}
      LENA_ADMIN_EMAILS: ${LENA_ADMIN_EMAILS:-}
      # Protected admins can never be demoted or banned via the API.
      LENA_PROTECTED_EMAILS: ${LENA_PROTECTED_EMAILS:-aipaloovik@gmail.com}
      # Writable import inbox shared with the host so uploaded scans are
      # available to the ocrimport CLI pipeline.
      LENA_IMPORT_INBOX: ${LENA_IMPORT_INBOX:-/data/import/inbox}
    volumes:
      - ./import:/data/import
    depends_on:
      db-seed:
        condition: service_completed_successfully
      seq-gelf:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: gelf
      options:
        # The GELF driver runs in the Docker daemon and resolves via the host.
        # seq-gelf publishes 12201/udp on the host, so localhost works.
        gelf-address: "udp://localhost:12201"
        tag: "{{.Name}}"

  web:
    build:
      context: clients/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/graphql}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-dummy}
    container_name: lena2-web
    environment:
      PORT: 3000
    depends_on:
      - api
      - seq-gelf
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "{{.Name}}"

  caddy:
    image: caddy:2.8.4-alpine
    container_name: lena2-caddy
    ports:
      - "80:80"
    environment:
      CADDY_ADDR: ${CADDY_ADDR:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  seq:
    image: datalust/seq:2024.1
    container_name: lena2-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      # Seq UI/API: http://localhost:5341
      - "5341:80"
    volumes:
      - seq_data:/data

  seq-gelf:
    image: datalust/seq-input-gelf:4.0.02323
    container_name: lena2-seq-gelf
    environment:
      SEQ_ADDRESS: http://seq:5341
    ports:
      - "12201:12201/udp"
    depends_on:
      - seq

volumes:
  pg_data:
  seq_data:
