services:
  db:
    image: postgres:16-alpine
    container_name: lena2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lena}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: migrate/migrate
    container_name: lena2-db-migrate
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db-seed:
    image: postgres:16-alpine
    container_name: lena2-db-seed
    env_file: .env
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - /bin/sh
      - -c
      - |
        for f in /seed/*.sql; do
          [ -e "$f" ] || continue
          psql -v ON_ERROR_STOP=1 -f "$f"
        done
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lena2-api
    env_file: .env
    environment:
      LENA_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: gelf
      options:
        gelf-address: "udp://seq-gelf:12201"
        tag: "{{.Name}}"

  web:
    build:
      context: clients/web
      dockerfile: Dockerfile
    container_name: lena2-web
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    logging:
      driver: gelf
      options:
        gelf-address: "udp://seq-gelf:12201"
        tag: "{{.Name}}"

  caddy:
    image: caddy:2-alpine
    container_name: lena2-caddy
    ports:
      - "80:80"
    environment:
      CADDY_ADDR: ${CADDY_ADDR:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  seq:
    image: datalust/seq:latest
    container_name: lena2-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data

  seq-gelf:
    image: datalust/seq-input-gelf:latest
    container_name: lena2-seq-gelf
    environment:
      SEQ_ADDRESS: http://seq:5341
    ports:
      - "12201:12201/udp"
    depends_on:
      - seq

volumes:
  pg_data:
  seq_data:
