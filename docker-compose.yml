# docker-compose.yml — PRODUCTION-hardened configuration.
# api/web run shell-less distroless images, the network is segmented, and
# all services carry no-new-privileges / cap_drop / read-only flags. For
# local debugging (docker exec shells, direct port access), layer
# docker-compose.debug.yml over this file — see that file's header.

# Default logging: local json-file with rotation. For centralized Seq/GELF
# logging, add the optional overlay:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Segmentation: `edge` carries the internet-facing path (caddy → api/web)
# on a pinned subnet so caddy's address is stable — the API trusts
# X-Forwarded-For only from that single /32 (keep subnet, ipv4_address,
# and LENA_TRUSTED_PROXY_CIDRS in agreement). Everything else rides the
# unpinned `default` net; observability services get their own so they
# cannot reach the database. The API is the only service bridged across
# all three.
networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  observability:

services:
  # pgvector image = postgres:18 + the vector extension (recipe embeddings).
  # Same PGDATA layout as the postgres:18 image, so existing volumes migrate
  # in place; the migration creates the extension itself.
  db:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lena}
      # postgres:18 images moved PGDATA to /var/lib/postgresql/18/docker and
      # fail when a volume is mounted at the legacy path; pinning PGDATA keeps
      # the existing pg_data volume layout working.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: migrate/migrate:v4.20.1@sha256:76cc2074cb6642631f34a898ced71e6aeaa6b1a4d78c4daa743275a22e0c5be7
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-lena}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-lena}?sslmode=${POSTGRES_SSLMODE:-disable}"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # Applies the lena_app role password after migrations create the role.
  # One-shot and instant; the API waits on this, not on the seed.
  db-grant:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      PGUSER: ${POSTGRES_USER:-lena}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      LENA_DB_PASSWORD: ${LENA_DB_PASSWORD:?LENA_DB_PASSWORD must be set}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lena}
    command:
      - /bin/sh
      - -c
      - "psql -v ON_ERROR_STOP=1 -c \"ALTER ROLE lena_app WITH PASSWORD '$LENA_DB_PASSWORD'\""
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # Reference-data seed. Optional and versioned: each /seed/*.sql runs once
  # and is recorded in public.schema_seed, so repeated `--profile seed up`
  # is a no-op and the API never waits on it.
  #   docker compose --profile seed up db-seed
  db-seed:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    profiles: ["seed"]
    environment:
      PGUSER: ${POSTGRES_USER:-lena}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lena}
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS public.schema_seed (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"
        for f in /seed/*.sql; do
          [ -e "$$f" ] || continue
          name=$$(basename "$$f")
          applied=$$(psql -tAc "SELECT 1 FROM public.schema_seed WHERE filename='$$name'")
          if [ "$$applied" = "1" ]; then
            echo "seed $$name already applied; skipping"
            continue
          fi
          psql -v ON_ERROR_STOP=1 -f "$$f"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.schema_seed (filename) VALUES ('$$name')"
        done
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LENA_PORT: 8080
      LENA_LOG_LEVEL: ${LENA_LOG_LEVEL:-info}
      LENA_DATABASE_URL: postgres://${LENA_DB_USER:-lena_app}:${LENA_DB_PASSWORD:?LENA_DB_PASSWORD must be set}@db:5432/${POSTGRES_DB:-lena}?sslmode=${POSTGRES_SSLMODE:-disable}
      LENA_GOOGLE_CLIENT_ID: ${LENA_GOOGLE_CLIENT_ID:?LENA_GOOGLE_CLIENT_ID must be set}
      LENA_AUTH_ISSUERS: ${LENA_AUTH_ISSUERS:-https://accounts.google.com}
      LENA_AUTH_AUDIENCES: ${LENA_AUTH_AUDIENCES:?LENA_AUTH_AUDIENCES must be set}
      LENA_CORS_ALLOWED_ORIGINS: ${LENA_CORS_ALLOWED_ORIGINS:-http://localhost}
      LENA_ADMIN_EMAILS: ${LENA_ADMIN_EMAILS:-}
      # Protected admins can never be demoted or banned via the API.
      LENA_PROTECTED_EMAILS: ${LENA_PROTECTED_EMAILS:-}
      # Trusted proxy CIDRs for X-Forwarded-For parsing. Must match caddy's
      # pinned ipv4_address below; the API never publishes a host port, so
      # only Caddy can reach it with a rewritten XFF.
      LENA_TRUSTED_PROXY_CIDRS: ${LENA_TRUSTED_PROXY_CIDRS:-172.31.0.10/32}
      # Session signing key for refresh-token access tokens. Empty keeps
      # OIDC-only auth (clients re-sign in when the ID token expires).
      LENA_SESSION_SECRET: ${LENA_SESSION_SECRET:-}
      LENA_DISCORD_CLIENT_ID: ${LENA_DISCORD_CLIENT_ID:-}
      LENA_DISCORD_CLIENT_SECRET: ${LENA_DISCORD_CLIENT_SECRET:-}
      LENA_DISCORD_REDIRECT_URI: ${LENA_DISCORD_REDIRECT_URI:-http://localhost/auth/discord/callback}
      LENA_MICROSOFT_CLIENT_ID: ${LENA_MICROSOFT_CLIENT_ID:-}
      LENA_MICROSOFT_CLIENT_SECRET: ${LENA_MICROSOFT_CLIENT_SECRET:-}
      LENA_MICROSOFT_TENANT: ${LENA_MICROSOFT_TENANT:-consumers}
      LENA_MICROSOFT_REDIRECT_URI: ${LENA_MICROSOFT_REDIRECT_URI:-http://localhost/auth/microsoft/callback}
      LENA_FACEBOOK_CLIENT_ID: ${LENA_FACEBOOK_CLIENT_ID:-}
      LENA_FACEBOOK_CLIENT_SECRET: ${LENA_FACEBOOK_CLIENT_SECRET:-}
      LENA_FACEBOOK_REDIRECT_URI: ${LENA_FACEBOOK_REDIRECT_URI:-http://localhost/auth/facebook/callback}
      # Writable import inbox (named volume so the container's chown applies).
      LENA_IMPORT_INBOX: ${LENA_IMPORT_INBOX:-/data/import/inbox}
      # AI assistant + semantic recipe search (optional). OLLAMA_URL alone
      # enables recipe embeddings; AI_PROVIDER also gates the chat assistant.
      LENA_OLLAMA_URL: ${LENA_OLLAMA_URL:-}
      LENA_OLLAMA_MODEL: ${LENA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      LENA_AI_PROVIDER: ${LENA_AI_PROVIDER:-}
      LENA_AI_MODEL: ${LENA_AI_MODEL:-}
      LENA_AI_EMBED_MODEL: ${LENA_AI_EMBED_MODEL:-nomic-embed-text}
      # AI assistant calls outlive the interactive GraphQL deadline; the
      # dedicated AI budget applies only to provider-backed fields, and the
      # HTTP write timeout must exceed it for replies to reach the client.
      LENA_GRAPHQL_TIMEOUT: ${LENA_GRAPHQL_TIMEOUT:-10s}
      LENA_GRAPHQL_AI_TIMEOUT: ${LENA_GRAPHQL_AI_TIMEOUT:-120s}
      LENA_HTTP_WRITE_TIMEOUT: ${LENA_HTTP_WRITE_TIMEOUT:-30s}
    volumes:
      - import_data:/data/import
    # edge for caddy, default for db/ocr/ollama, observability for jaeger.
    networks:
      - edge
      - default
      - observability
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db-grant:
        condition: service_completed_successfully
    healthcheck:
      # /ready verifies the database link, not just process liveness. The
      # distroless image has no shell/curl — the binary self-probes.
      test: ["CMD", "/app/lena", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    logging: *default-logging

  web:
    build:
      context: clients/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/graphql}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:?NEXT_PUBLIC_GOOGLE_CLIENT_ID must be set}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
        NEXT_PUBLIC_DISCORD_REDIRECT_URI: ${NEXT_PUBLIC_DISCORD_REDIRECT_URI:-http://localhost/auth/discord/callback}
        NEXT_PUBLIC_MICROSOFT_CLIENT_ID: ${NEXT_PUBLIC_MICROSOFT_CLIENT_ID:-}
        NEXT_PUBLIC_MICROSOFT_TENANT: ${NEXT_PUBLIC_MICROSOFT_TENANT:-consumers}
        NEXT_PUBLIC_MICROSOFT_REDIRECT_URI: ${NEXT_PUBLIC_MICROSOFT_REDIRECT_URI:-http://localhost/auth/microsoft/callback}
        NEXT_PUBLIC_FACEBOOK_CLIENT_ID: ${NEXT_PUBLIC_FACEBOOK_CLIENT_ID:-}
        NEXT_PUBLIC_FACEBOOK_REDIRECT_URI: ${NEXT_PUBLIC_FACEBOOK_REDIRECT_URI:-http://localhost/auth/facebook/callback}
    environment:
      PORT: 3000
    # Edge-only: the browser reaches the API through Caddy, so web never
    # needs a route to the database or observability services.
    networks:
      - edge
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    logging: *default-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - "80:80"
    environment:
      CADDY_ADDR: ${CADDY_ADDR:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Edge-only, static address on the pinned subnet: the API's
    # X-Forwarded-For trust list is exactly this /32, so a stable IP is
    # required.
    networks:
      edge:
        ipv4_address: 172.31.0.10
    depends_on:
      - api
      - web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Binding :80 inside the container requires this one capability.
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pg_data:
  import_data:
  caddy_data:
  caddy_config:
