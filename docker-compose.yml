services:
  db:
    image: postgres:16-alpine
    container_name: lena2-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-lena}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lena}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: migrate/migrate
    container_name: lena2-db-migrate
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-lena}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-lena}?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db-seed:
    image: postgres:16-alpine
    container_name: lena2-db-seed
    environment:
      PGUSER: ${POSTGRES_USER:-lena}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-lena}
    volumes:
      - ./migrations/seed:/seed:ro
    command:
      - /bin/sh
      - -c
      - "for f in /seed/*.sql; do [ -e \"$$f\" ] || continue; psql -v ON_ERROR_STOP=1 -f \"$$f\"; done"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lena2-api
    environment:
      LENA_PORT: 8080
      LENA_LOG_LEVEL: ${LENA_LOG_LEVEL:-info}
      LENA_DATABASE_URL: postgres://${POSTGRES_USER:-lena}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-lena}?sslmode=disable
      LENA_GOOGLE_CLIENT_ID: ${LENA_GOOGLE_CLIENT_ID:-dummy}
      LENA_AUTH_ISSUERS: ${LENA_AUTH_ISSUERS:-https://accounts.google.com}
      LENA_AUTH_AUDIENCES: ${LENA_AUTH_AUDIENCES:-dummy}
      LENA_CORS_ALLOWED_ORIGINS: ${LENA_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      seq-gelf:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: gelf
      options:
        gelf-address: "udp://seq-gelf:12201"
        tag: "{{.Name}}"

  web:
    build:
      context: clients/web
      dockerfile: Dockerfile
    container_name: lena2-web
    environment:
      PORT: 3000
      NEXT_PUBLIC_LENA_API_URL: ${NEXT_PUBLIC_LENA_API_URL:-/graphql}
    ports:
      - "3000:3000"
    depends_on:
      - api
      - seq-gelf
    logging:
      driver: gelf
      options:
        gelf-address: "udp://seq-gelf:12201"
        tag: "{{.Name}}"

  caddy:
    image: caddy:2-alpine
    container_name: lena2-caddy
    ports:
      - "80:80"
    environment:
      CADDY_ADDR: ${CADDY_ADDR:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

  seq:
    image: datalust/seq:latest
    container_name: lena2-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data

  seq-gelf:
    image: datalust/seq-input-gelf:latest
    container_name: lena2-seq-gelf
    environment:
      SEQ_ADDRESS: http://seq:5341
    ports:
      - "12201:12201/udp"
    depends_on:
      - seq

volumes:
  pg_data:
  seq_data:
